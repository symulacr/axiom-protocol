[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
broadcast = "broadcast"
# Parallel solc jobs: 0 = all logical cores (foundry issue #8689: threads>0 shows 1 solc in htop, but -j/threads=0 uses all cores)
threads = 0
# Keep compiler filesystem emulation in RAM (fewer disk hits, faster builds)
fse = { memory_limit = "4 GiB" }

# Allow deployment scripts to write the deployment manifest to ../../docs/deployments/
fs_permissions = [{ access = "write", path = "../.." }]

# Cancun mandatory on 0G Chain
evm_version = "cancun"

# Solidity 0.8.24 (min required by OpenZeppelin 5.5+; 0G reference repo comment kept for provenance)
solc = "0.8.24"

# Min runs = smallest bytecode. 0G has zero gas fees, so runtime gas cost is irrelevant.
optimizer_runs = 1
bytecode_hash = "none"

# viaIR on (per 0G docs) — needed to keep AxiomAgentNFT under EIP-170 (22,022B of 24,576B)
via_ir = true
verbosity = 2
gas_reports = ["*"]
fuzz = { runs = 256 }

# Fast iteration profile: threads + fse only. via_ir must stay ON — the suite hits
# "Stack too deep" without it (LValue.cpp:51), which is the original reason it was enabled.
[profile.dev]
via_ir = true
optimizer_runs = 1
verbosity = 1
threads = 0
fse = { memory_limit = "4 GiB" }
gas_reports = []
fuzz = { runs = 64 }

# CI profile with more aggressive fuzzing
[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 32, fail_on_revert = true }

# Format settings (using [fmt] section for newer Foundry)
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
