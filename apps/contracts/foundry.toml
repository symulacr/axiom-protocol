[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
broadcast = "broadcast"
# Parallel solc jobs: 0 = all logical cores (foundry issue #8689: threads>0 shows 1 solc in htop, but -j/threads=0 uses all cores)
threads = 0
# Keep compiler filesystem emulation in RAM (fewer disk hits, faster builds)
fse = { memory_limit = "4 GiB" }
# Prune compiler output for unchanged files — cuts artifact I/O + RSS on iterative builds
# (experimental; https://www.getfoundry.sh/config/reference/solidity-compiler)
sparse_mode = true
# Link tests dynamically against the build artifacts (default-on since foundry v1.5.0;
# explicit here to document intent — https://github.com/foundry-rs/foundry/pull/10285)
dynamic_test_linking = true

# Allow deployment scripts to write the deployment manifest to ../../docs/deployments/
fs_permissions = [{ access = "write", path = "../.." }]

# Cancun mandatory on 0G Chain
evm_version = "cancun"

# Solidity 0.8.30 — SSA codegen + newer compiler (evidence: soliditylang releases).
solc = "0.8.30"

# Min runs = smallest bytecode. 0G has zero gas fees, so runtime gas cost is irrelevant.
optimizer_runs = 1
bytecode_hash = "none"

# Deploy profile: via_ir GLOBAL ON. compilation_restrictions cascade to any script that
# imports a restricted file (Deploy.s.sol imports everything), producing .via-ir artifacts
# whose initialize calldata mismatched the linked impl — broke proxy init on Galileo.
# Correctness first; use FOUNDRY_PROFILE=dev for fast iteration.
via_ir = true
verbosity = 2
gas_reports = ["*"]
fuzz = { runs = 256 }
# Minimal artifacts = less disk I/O + lower RSS (evidence: forge build docs)
build_info = false
extra_output = ["abi", "evm.bytecode"]

# Fast iteration profile: threads + fse only. via_ir must stay ON — the suite hits
# "Stack too deep" without it (LValue.cpp:51), which is the original reason it was enabled.
[profile.dev]
via_ir = true
optimizer_runs = 1
verbosity = 1
threads = 0
fse = { memory_limit = "4 GiB" }
gas_reports = []
fuzz = { runs = 64 }
build_info = false
extra_output = ["abi", "evm.bytecode"]

# CI profile with more aggressive fuzzing
[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 32, fail_on_revert = true }

# Format settings (using [fmt] section for newer Foundry)
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

# Skip solar lint on every build — linting is covered separately (solhint / forge fmt in CI)
[lint]
lint_on_build = false
