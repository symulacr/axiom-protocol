    <!-- Audit critique-3 C2/I5: og-1200.jpg was declared but never shipped
         (public/brand/ was empty) and og:url/type/site_name + twitter
         fallbacks were missing — every social embed rendered broken. Icons:
         Bun.build resolves head <link href> through the module graph (public/
         is served by the static handler, not the graph), so the favicon stays
         a data URI; the PWA icon set ships in /brand/ for crawlers + manifests. -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='23' fill='%23111315'/%3E%3Ccircle cx='90' cy='90' r='56' fill='none' stroke='%23d28b52' stroke-width='11'/%3E%3Ccircle cx='90' cy='90' r='22' fill='%2367e8b4'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23111315'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23d28b52' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2367e8b4'/%3E%3C/svg%3E" />
    <script>
      // Theme + reduced-motion init before first paint — kills the dark→light
      // flash for stored-light users and zeroes landing entrances before
      // hydration for stored reduced-motion users (critique-3 RM-3: the
      // in-app Reduced-motion setting must reach the landing page, which
      // renders outside .app-shell). Single owner: axiom-ui-settings
      // (C-SETTINGS); the legacy axiom-theme mirror key is gone — when no
      // stored choice exists the boot script and the store agree on following
      // the OS.
      (function () {
        try {
          var v = null;
          var rm = null;
          var raw = localStorage.getItem("axiom-ui-settings");
          if (raw) {
            var s = JSON.parse(raw);
            if (s) {
              var t = s.theme;
              if (t === "light" || t === "dark") v = t;
              rm = s.reducedMotion === true;
            }
          }
          if (v !== "light" && v !== "dark") {
            v = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = v;
          document.documentElement.style.colorScheme = v;
          if (rm === true) {
            document.documentElement.dataset.reduceMotion = "true";
          } else {
            delete document.documentElement.dataset.reduceMotion;
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="description" content="Axiom: own an AI agent on-chain. Mint, fund, run and transfer agents that act on your behalf. Your agent's data is re-sealed for each new owner. Real state, visible at all times." />
