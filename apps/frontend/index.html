<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      as="style"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Theme init before first paint — kills the dark→light flash for stored-light users.
      (function () {
        try {
          var v = localStorage.getItem("axiom-theme");
          if (v !== "light" && v !== "dark") {
            v = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = v;
          document.documentElement.style.colorScheme = v;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="description" content="Axiom — own an AI agent on-chain. Mint, fund, run, and transfer agents that act on your behalf. Your agent's data is re-sealed for each new owner. Real state, visible at all times." />

    <meta property="og:description" content="Ownable AI agents on 0G. Mint, fund, run, and transfer. Vaults · on-chain tools · Axiom assistant." />
