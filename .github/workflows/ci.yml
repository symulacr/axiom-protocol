name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run:
          bun run --filter @axiom/config build && bun run --filter @axiom/config
          typecheck
      - run: bun run --filter @axiom/chat-runtime build && bun run --filter
          @axiom/chat-runtime typecheck
      - run:
          bun run --filter @axiom/backend build && bun run --filter @axiom/backend
          typecheck
      - run: bun run --filter @axiom/backend typecheck:e2e
      - run: bun run --filter @axiom/frontend typecheck
      - run: bun run --filter @axiom/frontend lint
      - run: bun run --filter @axiom/contracts typecheck
      - name: Dependency audit
        run: bun audit || true
      - name: Prove tests are tracked (C0)
        run: |
          set -euo pipefail
          n_ts=$(git ls-files '*.test.ts' '*.spec.ts' | wc -l)
          n_sol=$(git ls-files '*.t.sol' | wc -l)
          echo "tracked test.ts/spec.ts=$n_ts t.sol=$n_sol"
          test "$n_ts" -ge 20
          test "$n_sol" -ge 5
          git check-ignore -v apps/backend/src/server/disable-auth.test.ts && exit 1 || true
          git check-ignore -v apps/contracts/test/AxiomAgentNFT.t.sol && exit 1 || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @axiom/config build
      - run: bun run --filter @axiom/chat-runtime build
      - run: bun run --filter @axiom/frontend build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @axiom/config build
      - run: bun run --filter @axiom/chat-runtime build
      - run: bun run --filter @axiom/config test
      - run: bun run --filter @axiom/chat-runtime test
      - run: bun run --filter @axiom/backend test
      - name: OpenAPI freshness
        run: |
          cd apps/backend
          bun run generate:openapi
          git diff --exit-code docs/openapi.json
      - name: Coverage gate (C1)
        env:
          AXIOM_API_KEY: ""
          AXIOM_CLIENT_API_KEY: ""
          AXIOM_DISABLE_AUTH: "true"
          AXIOM_ALLOW_CLEARTEXT_DEK: "true"
        run: |
          set -euo pipefail
          check() { # $1=dir $2=min-lines-floor
            pct=$(cd "$1" && bun test --coverage --max-concurrency=1 2>&1 | awk '/All files/ {gsub(/\|/,""); print $NF}')
            echo "$1 lines=$pct (floor $2)"
            awk -v p="$pct" -v f="$2" 'BEGIN{exit !(p>=f)}'
          }
          check apps/backend 60
          check packages/config 80
          check packages/chat-runtime 65

  contracts:
    name: Forge tests (local)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_LIVE_FORK: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1 # pin toolchain; action default is nightly
      - run: bash scripts/ci-forge-install.sh
      - run: forge test -vv
        working-directory: apps/contracts
      - name: ABI drift check
        run: bash scripts/check-abi-drift.sh

  chat-bench:
    name: Chat tool parity
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    # Public Anvil test keys only — NOT production. Never fund on mainnet.
    env:
      AXIOM_EVM_RPC: https://evmrpc-testnet.0g.ai
      DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
      E2E_RECEIVER_PK: ${{ secrets.E2E_RECEIVER_PK }}
      RECEIVER_PK: ${{ secrets.RECEIVER_PK }}
      AXIOM_TEE_SIGNER_PK: ${{ secrets.AXIOM_TEE_SIGNER_PK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @axiom/config build
      - run: bun run --filter @axiom/chat-runtime build
      - run: bun run --filter @axiom/backend build
      - name: Start backend
        run: |
          cd apps/backend
          AXIOM_RATE_LIMIT_MAX=50000 AXIOM_HEALTH_CACHE_MS=3000 \
            bun dist/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1
      - name: Chat bench (CI mode)
        run: bun run run-chat-bench
        working-directory: apps/backend
        env:
          E2E_LIVE_COMPUTE: "0"
          BACKEND_URL: http://127.0.0.1:3000
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then kill "$(cat /tmp/backend.pid)" 2>/dev/null || true; fi
