name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history so the scan covers the whole commit graph, not just HEAD.
          fetch-depth: 0
      # Reads the repo's .gitleaks.toml (placeholder-only .env.example convention,
      # public Galileo address allowlist). OPT-02: the config existed but was
      # invoked nowhere — this job is the guard.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run:
          bun run --filter @axiom/config build && bun run --filter @axiom/config
          typecheck
      - run: bun run --filter @axiom/chat-runtime build && bun run --filter
          @axiom/chat-runtime typecheck
      - run:
          bun run --filter @axiom/backend build && bun run --filter @axiom/backend
          typecheck
      - run: bun run --filter @axiom/frontend typecheck
      - run: bun run --filter @axiom/frontend lint
      - run: bun run --filter @axiom/contracts typecheck
      - name: Dependency audit
        run: bun audit || true
      - name: Prove tests are tracked (C0)
        run: |
          set -euo pipefail
          n_ts=$(git ls-files '*.test.ts' '*.spec.ts' | wc -l)
          n_sol=$(git ls-files '*.t.sol' | wc -l)
          echo "tracked test.ts/spec.ts=$n_ts t.sol=$n_sol"
          test "$n_ts" -ge 20
          test "$n_sol" -ge 5
          git check-ignore -v apps/backend/src/server/disable-auth.test.ts && exit 1 || true
          git check-ignore -v apps/contracts/test/AxiomAgentNFT.t.sol && exit 1 || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @axiom/config build
      - run: bun run --filter @axiom/chat-runtime build
      - run: bun run --filter @axiom/frontend build

  contracts:
    name: Forge tests (local)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_LIVE_FORK: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1 # pin toolchain; action default is nightly
      - run: bash scripts/ci-forge-install.sh
      - run: forge test -vv
        working-directory: apps/contracts
      - name: ABI drift check
        run: bash scripts/check-abi-drift.sh
