name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axiom/config build
      - run: pnpm --filter @axiom/chat-runtime build
      - run: pnpm --filter @axiom/oracle build
      - run: pnpm --filter @axiom/backend build
      - run: pnpm --filter @axiom/frontend typecheck
      - run: pnpm --filter @axiom/frontend lint
      - run: pnpm --filter @axiom/contracts typecheck

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axiom/config build
      - run: pnpm --filter @axiom/chat-runtime build
      - run: pnpm --filter @axiom/frontend build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axiom/config build
      - run: pnpm --filter @axiom/chat-runtime build
      - run: pnpm --filter @axiom/backend test
      - run: pnpm --filter @axiom/oracle test
      - run: pnpm --filter @axiom/chat-runtime test

  contracts:
    name: Forge tests (local)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_LIVE_FORK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/ci-forge-install.sh
      - run: forge test -vv
        working-directory: apps/contracts

  chat-bench:
    name: Chat tool parity
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axiom/config build
      - run: pnpm --filter @axiom/chat-runtime build
      - run: pnpm --filter @axiom/backend build
      - name: Start backend
        run: |
          cd apps/backend
          AXIOM_RATE_LIMIT_MAX=50000 AXIOM_HEALTH_CACHE_MS=3000 \
            node dist/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1
      - name: Chat bench (CI mode)
        run: pnpm --filter @axiom/backend run run-chat-bench
        env:
          E2E_LIVE_COMPUTE: "0"
          BACKEND_URL: http://127.0.0.1:3000
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then kill "$(cat /tmp/backend.pid)" 2>/dev/null || true; fi