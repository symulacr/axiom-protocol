name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-secrets:
    name: Validate secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          E2E_OPERATOR_PK: ${{ secrets.E2E_OPERATOR_PK }}
          E2E_RECEIVER_PK: ${{ secrets.E2E_RECEIVER_PK }}
          AXIOM_COMPUTE_DIRECT_KEY: ${{ secrets.AXIOM_COMPUTE_DIRECT_KEY }}
        run: |
          missing=0
          for key in DEPLOYER_PK E2E_OPERATOR_PK E2E_RECEIVER_PK AXIOM_COMPUTE_DIRECT_KEY; do
            eval "val=\$$key"
            if [ -z "$val" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure GitHub repository secrets before running nightly."
            exit 1
          fi

  live-chat-bench:
    name: Live chat bench
    runs-on: ubuntu-latest
    needs: [require-secrets]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @axiom/config build
      - run: bun run --filter @axiom/chat-runtime build
      - name: Start backend
        env:
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          E2E_OPERATOR_PK: ${{ secrets.E2E_OPERATOR_PK }}
          E2E_RECEIVER_PK: ${{ secrets.E2E_RECEIVER_PK }}
          AXIOM_COMPUTE_DIRECT_KEY: ${{ secrets.AXIOM_COMPUTE_DIRECT_KEY }}
          OG_COMPUTE_API_KEY: ${{ secrets.OG_COMPUTE_API_KEY }}
          AXIOM_RATE_LIMIT_MAX: "50000"
        run: |
          cd apps/backend
          bun src/index.ts > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: Live chat bench
        env:
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          E2E_OPERATOR_PK: ${{ secrets.E2E_OPERATOR_PK }}
          E2E_RECEIVER_PK: ${{ secrets.E2E_RECEIVER_PK }}
          AXIOM_COMPUTE_DIRECT_KEY: ${{ secrets.AXIOM_COMPUTE_DIRECT_KEY }}
          OG_COMPUTE_API_KEY: ${{ secrets.OG_COMPUTE_API_KEY }}
          E2E_LIVE_COMPUTE: "1"
          BACKEND_URL: http://127.0.0.1:3000
        run: bun run --filter @axiom/backend run-chat-bench:live
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then kill "$(cat /tmp/backend.pid)" 2>/dev/null || true; fi

  load-bench:
    name: Load bench smoke
    runs-on: ubuntu-latest
    needs: [require-secrets]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Start backend
        env:
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          AXIOM_RATE_LIMIT_MAX: "50000"
        run: |
          cd apps/backend
          bun src/index.ts > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: Load bench
        env:
          BENCH_ITERATIONS: "5"
          BENCH_CONCURRENCY: "1"
          LOAD_BENCH_CHAT: "0"
          BACKEND_URL: http://127.0.0.1:3000
        run: bun run --filter @axiom/backend run-load-bench
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then kill "$(cat /tmp/backend.pid)" 2>/dev/null || true; fi

  contracts-fork:
    name: Forge fork tests
    runs-on: ubuntu-latest
    needs: [require-secrets]
    env:
      FOUNDRY_LIVE_FORK: "1"
      DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
      AXIOM_OPERATOR_PK: ${{ secrets.AXIOM_OPERATOR_PK }}
      AXIOM_TEE_SIGNER_PK: ${{ secrets.AXIOM_TEE_SIGNER_PK }}
      AXIOM_TEST_RECEIVER_1_PK: ${{ secrets.AXIOM_TEST_RECEIVER_1_PK }}
      AXIOM_TEST_RECEIVER_2_PK: ${{ secrets.AXIOM_TEST_RECEIVER_2_PK }}
      AGENT_NFT_ADDRESS: ${{ vars.AGENT_NFT_ADDRESS }}
      AXIOM_TEE_VERIFIER_ADDRESS: ${{ vars.AXIOM_TEE_VERIFIER_ADDRESS }}
      AXIOM_OPERATOR_ADDRESS: ${{ vars.AXIOM_OPERATOR_ADDRESS }}
      AXIOM_TEST_RECEIVER_1_ADDRESS: ${{ vars.AXIOM_TEST_RECEIVER_1_ADDRESS }}
      AXIOM_TEST_RECEIVER_2_ADDRESS: ${{ vars.AXIOM_TEST_RECEIVER_2_ADDRESS }}
      OG_RPC_URL: https://evmrpc-testnet.0g.ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - run: bash scripts/ci-forge-install.sh
      - name: Require fork address vars
        run: |
          for key in AGENT_NFT_ADDRESS AXIOM_TEE_VERIFIER_ADDRESS AXIOM_OPERATOR_ADDRESS; do
            eval "val=\$$key"
            if [ -z "$val" ]; then
              echo "Missing repository variable: $key"
              exit 1
            fi
          done
      - run: forge test -vv --match-contract FuzzAxiomAgentNFTSanity
        working-directory: apps/contracts
