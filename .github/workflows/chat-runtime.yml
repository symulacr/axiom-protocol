name: Chat Runtime (path filter)

on:
  pull_request:
    branches: [master, main]
    paths:
      - "packages/chat-runtime/**"
      - "packages/config/src/chat-tools.ts"
      - "packages/config/src/abis/**"
      - "apps/frontend/src/chat/**"
      - "apps/backend/src/cli/e2e/transport-node.ts"
      - "apps/backend/src/cli/e2e/complex-flow-bench.ts"
      - "apps/backend/src/cli/e2e/chat-bench.ts"
  workflow_dispatch:

jobs:
  chat-runtime:
    name: chat-runtime build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @axiom/config build
      - run: bun run --filter @axiom/chat-runtime build
      - run: bun run --filter @axiom/chat-runtime test
