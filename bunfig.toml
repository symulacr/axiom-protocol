# Bun-native port (Phase 5): Bun is the canonical package manager / runtime
# / test runner for this repo. Node remains installed as a co-runtime only.
# See report/campaign/cycle-03/AGENT_B_BUNPORT.md.

# Opt out of anonymous usage telemetry (top-level setting, verified on
# bun 1.4.0-canary; equivalent env: DO_NOT_TRACK=1).
telemetry = false

[install]
# Flipped for bun.lock bootstrap; CI passes --frozen-lockfile explicitly.
frozenLockfile = false

[test]
# `bun test` runs TS natively — a drop-in for `node --import tsx --test`
# at packages/config and packages/chat-runtime (parity verified in P1).
