# gitleaks configuration — Axiom Protocol
# The default ruleset is kept; we only allowlist known PUBLIC 0G testnet
# contract/signer addresses (not secrets), so `gitleaks detect` stays clean
# without hiding real leaks. .env.example is NOT path-allowlisted — keep it
# placeholder-only (`sk-<...>`, `0x<...>`); real keys must never land in it.

[extend]
useDefault = true

[allowlist]
description = "Known public 0G Galileo testnet addresses (deployed contracts + signer/deployer) — not secrets."
