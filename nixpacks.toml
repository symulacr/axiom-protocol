[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]
[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@10.22.0 --activate", "pnpm install --frozen-lockfile"]
[phases.build]
cmds = [
  "pnpm --filter @axiom/config build",
  "pnpm --filter @axiom/chat-runtime build",
  "pnpm --filter @axiom/oracle build",
  "pnpm --filter @axiom/backend build"
]
cacheDirectives = ["node_modules", "packages/config/dist", "packages/chat-runtime/dist", "apps/backend/dist", "apps/oracle/dist"]
